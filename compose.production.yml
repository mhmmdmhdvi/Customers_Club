services:
  api:
    environment:
      NODE_ENV: production
      AUTH_ALLOWED_ORIGINS: ${CLUB_ORIGIN:?Set exact HTTPS CLUB_ORIGIN}
    restart: unless-stopped
  db:
    restart: unless-stopped
  frontend:
    ports: !override ["443:443"]
    volumes:
      - ./deployment/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/tls:/etc/nginx/tls:ro
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8081/health"]
    restart: unless-stopped
